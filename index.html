    /* CLTX4 REDLINE // visual redesign only — keeps the existing React logic intact */
    :root { color-scheme: dark; --cltx-red:#ff2638; --cltx-red2:#b70d24; --cltx-cyan:#35e7ff; --cltx-panel:rgba(10,12,20,.91); }
    html { background:#05060a; }
    body { background:#05060a !important; color:#dbe3ef !important; }
    body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:radial-gradient(ellipse at 12% 4%,rgba(255,25,54,.14),transparent 35%),radial-gradient(ellipse at 90% 70%,rgba(53,231,255,.07),transparent 33%),linear-gradient(135deg,#08090e 0%,#090b12 50%,#05060a 100%); }

    #root > div { isolation:isolate; }
    header { border-color:rgba(255,38,56,.34) !important; position:relative; }

    h1 { letter-spacing:.055em !important; text-shadow:0 0 24px rgba(255,38,56,.16); }
    /* Replace former pink palette with CLTX4 red; reserve cyan for focus/high-tech details. */
    [class*="text-pink-"] { color:#ff5263 !important; }
    [class*="border-pink-"] { border-color:rgba(255,38,56,.42) !important; }
    [class*="bg-pink-"] { background-color:#b70d24 !important; }

    [class*="to-rose-"] { --tw-gradient-to:#8d1027 var(--tw-gradient-to-position) !important; }
    [class*="focus:border-pink"]:focus { border-color:var(--cltx-cyan) !important; box-shadow:0 0 0 2px rgba(53,231,255,.13) !important; }
    [class*="focus:ring-pink"]:focus { --tw-ring-color:rgba(53,231,255,.55) !important; }
    /* Glass panels get sharper edges, red rim-light, and a subtle angled highlight. */
    .rounded-3xl { border-radius:22px !important; }
    .rounded-2xl { border-radius:16px !important; }
    .rounded-xl { border-radius:12px !important; }
    .shadow-2xl { box-shadow:0 22px 70px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.018) !important; }
    .backdrop-blur-md, .backdrop-blur-2xl { backdrop-filter:blur(18px) saturate(125%) !important; }
    #root .bg-slate-900\/90, #root .bg-slate-900\/95 { background:linear-gradient(145deg,rgba(19,20,30,.96),rgba(8,9,15,.96)) !important; }
    #root .bg-slate-900\/80 { background:linear-gradient(145deg,rgba(17,19,29,.95),rgba(8,10,16,.96)) !important; }
    #root .bg-slate-950\/70, #root .bg-slate-950\/50 { background-color:rgba(5,7,13,.7) !important; }
    #root .border-slate-800 { border-color:rgba(148,163,184,.15) !important; }
    #root .border-slate-700 { border-color:rgba(148,163,184,.22) !important; }
    select, input, textarea { accent-color:var(--cltx-red); }
    #root select, #root input:not([type="file"]), #root textarea { transition:border-color .18s ease, box-shadow .18s ease, background .18s ease; }
    #root select:focus, #root input:focus, #root textarea:focus { outline:none; border-color:var(--cltx-cyan) !important; box-shadow:0 0 0 2px rgba(53,231,255,.12),0 0 18px rgba(53,231,255,.05); }
    #root select option { background:#0a0c13; color:#e5e7eb; }
    #root button { transition:filter .18s ease, transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
    #root button:hover:not(:disabled) { filter:brightness(1.12); }
    #root button:focus-visible, #root a:focus-visible { outline:2px solid var(--cltx-cyan); outline-offset:3px; }
    /* Main board/library picker becomes a prominent redline control console. */
    #root .cltx4-desktop-layout > div.grid > div:first-child > div { box-shadow:inset 0 1px rgba(255,255,255,.025),0 16px 42px rgba(0,0,0,.22); }
    #root label { letter-spacing:.075em; }
    #root .font-mono { text-shadow:0 0 9px rgba(53,231,255,.04); }
    .custom-scrollbar::-webkit-scrollbar { width:8px; height:8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background:#080a10; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background:linear-gradient(var(--cltx-red),#68101c); border:2px solid #080a10; border-radius:20px; }
    ::selection { background:rgba(255,38,56,.4); color:white; }
    @media (max-width:640px) {
      .cltx4-desktop-layout { padding:14px !important; }
      header { padding-bottom:20px; }
      #root .rounded-3xl { border-radius:17px !important; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition-duration:.01ms !important; animation-duration:.01ms !important; } }
  </style>

      // M5-Stack
      { id: 'xingzhi-cube-s3', name: 'Xingzhi-Cube', chip: 'ESP32-S3', family: 'Bruce Predatory', url: 'Bruce-xingzhi-cube-s3.bin' },
      { id: 'Launcher-xingzhi-cube-s3', name: 'Launcher-Xingzhi-Cube', chip: 'ESP32-S3', family: 'Launcher', url: 'Launcher-xingzhi-cube-s3.bin' },

      { id: 'esp32-c5-tft', name: 'ESP32-C5', chip: 'ESP32-C5', family: 'Bruce Predatory', url: '' },
      // Additional firmware-library slots. Choose a matching .bin locally or set its direct URL in Admin.
      { id: 'marauder-cyd', name: 'CYD (Cheap Yellow Display)', chip: 'ESP32', family: 'Marauder', url: '' },
      { id: 'marauder-esp32', name: 'Generic ESP32 Dev Board', chip: 'ESP32', family: 'Marauder', url: '' },
      { id: 'marauder-esp32-s3', name: 'ESP32-S3 Board', chip: 'ESP32-S3', family: 'Marauder', url: '' },
      { id: 'ghost-cyd', name: 'CYD (Cheap Yellow Display)', chip: 'ESP32', family: 'Ghost ESP', url: '' },
      { id: 'ghost-esp32-s3', name: 'ESP32-S3 Board', chip: 'ESP32-S3', family: 'Ghost ESP', url: '' },
      { id: 'deauther-esp8266', name: 'ESP8266 Board', chip: 'ESP8266', family: 'ESP8266 Deauther', url: '' },
      { id: 'custom-firmware', name: 'Custom firmware / any supported board', chip: 'ESP32', family: 'Other / Custom', url: '' },

    function App() {
      const [lang, setLang] = useState('en');
      const t = (key) => TRANSLATIONS[lang][key] || TRANSLATIONS.en[key] || key;

      const [isSerialSupported, setIsSerialSupported] = useState(true);
      const [isConnected, setIsConnected] = useState(false);
      const [baudRate, setBaudRate] = useState(921600);
      // User-editable flasher options (kept in this single index.html)
      const [firmwareFamily, setFirmwareFamily] = useState('');
      const [firmwareFamilies, setFirmwareFamilies] = useState(['All Firmware', ...INITIAL_FIRMWARE_FAMILIES]);
      const [categoryDescriptions, setCategoryDescriptions] = useState({ ...INITIAL_CATEGORY_DESCRIPTIONS });
      const [newFamilyName, setNewFamilyName] = useState('');
      const [deviceFilter, setDeviceFilter] = useState('All');
      const [boardSearch, setBoardSearch] = useState('');
      const [showAdvancedOptions, setShowAdvancedOptions] = useState(false);
      const [flashAddress, setFlashAddress] = useState('0x0');
      const [eraseAllFlash, setEraseAllFlash] = useState(false); 
      
      const [boards, setBoards] = useState(INITIAL_BOARDS);
      const [selectedBoardId, setSelectedBoardId] = useState('');
      const getHardwareKey = (board) => `${String(board.name || '').trim().toLowerCase()}::${String(board.chip || '').trim().toLowerCase()}`;
      const hardwareOptions = Array.from(new Map(boards.map(board => [getHardwareKey(board), {
        key: getHardwareKey(board), name: String(board.name || 'Unnamed board').trim(), chip: String(board.chip || 'Unknown chip').trim(),
        ids: boards.filter(item => getHardwareKey(item) === getHardwareKey(board)).map(item => item.id)
      }])).values());
      const [selectedHardwareKey, setSelectedHardwareKey] = useState('');
      const selectedHardware = hardwareOptions.find(item => item.key === selectedHardwareKey) || null;
      const isFirmwareCompatible = (entry, hardware) => {
        if (!entry || !hardware) return false;
        const configured = Array.isArray(entry.supportedBoards)
          ? entry.supportedBoards
          : String(entry.supportedBoards || '').split(',');
        const targets = configured.map(value => String(value).trim().toLowerCase()).filter(Boolean);
        if (targets.length) {
          const accepted = [hardware.key, hardware.name.toLowerCase(), ...hardware.ids.map(id => String(id).toLowerCase())];
          return targets.some(target => accepted.includes(target));
        }
        // Safe default: a build supports only its own exact board name + chip unless Admin explicitly adds targets.
        return getHardwareKey(entry) === hardware.key;
      };
      const selectedBoard = boards.find(b => b.id === selectedBoardId);

      const [localFile, setLocalFile] = useState(null);
      const [githubFirmwareStatus, setGithubFirmwareStatus] = useState('checking');
      const [githubFirmwareCheckedUrl, setGithubFirmwareCheckedUrl] = useState('');
      const localFileInputRef = useRef(null);
      const [bgUrl, setBgUrl] = useState(INITIAL_SETTINGS.bgUrl);
      const [logoUrl, setLogoUrl] = useState(INITIAL_SETTINGS.logoUrl);

      const [isAdmin, setIsAdmin] = useState(false);
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [adminInput, setAdminInput] = useState("");
      const [adminTab, setAdminTab] = useState('firmware');
      const [loginError, setLoginError] = useState(false);

      const [showDonateModal, setShowDonateModal] = useState(false);
      const [copied, setCopied] = useState(false);

      const [logTab, setLogTab] = useState('system');
      const [sysLogs, setSysLogs] = useState([]);
      const [devLogs, setDevLogs] = useState([]);

      const [isMonitorRunning, setIsMonitorRunning] = useState(false);
      const [isFlashing, setIsFlashing] = useState(false);
      const [progress, setProgress] = useState(0);
      
      const terminalRef = useRef(null);
      const portRef = useRef(null);
      const transportRef = useRef(null);
      const readerRef = useRef(null);
      const isReadingRef = useRef(false);

      useEffect(() => {
        if (selectedHardwareKey && hardwareOptions.length && !hardwareOptions.some(item => item.key === selectedHardwareKey)) {
          setSelectedHardwareKey(hardwareOptions[0].key);
          setFirmwareFamily('');
          setSelectedBoardId('');
        }
      }, [boards, selectedHardwareKey]);

      useEffect(() => {
        if (!('serial' in navigator)) setIsSerialSupported(false);

        // Fetch IP Geolocation to auto-set language
        fetch('https://get.geojs.io/v1/ip/country.json')
          .then(res => res.json())
          .then(data => {
            if (data.country === 'PH') setLang('fil');
            else setLang('en');
          })
          .catch(error => console.log('Không check được IP, dùng mặc định:', error));

        const savedConfig = localStorage.getItem('cltx4_web_flasher_config_v1');
        if (savedConfig) {
          try {
            const parsed = JSON.parse(savedConfig);
            if (parsed.boards) setBoards(parsed.boards.map(b => ({ description: '', supportedBoards: '', ...b })));
            if (Array.isArray(parsed.firmwareFamilies) && parsed.firmwareFamilies.length) setFirmwareFamilies(['All Firmware', ...parsed.firmwareFamilies.filter(f => f && f !== 'All Firmware')]);
            if (parsed.categoryDescriptions && typeof parsed.categoryDescriptions === 'object') setCategoryDescriptions({ ...INITIAL_CATEGORY_DESCRIPTIONS, ...parsed.categoryDescriptions });
            if (parsed.settings) {
              if (parsed.settings.bgUrl) setBgUrl(parsed.settings.bgUrl);
              if (parsed.settings.logoUrl) setLogoUrl(parsed.settings.logoUrl);
            }
          } catch(e) {}
        }
      }, []);

      // Check the selected board's GitHub-hosted firmware independently of local uploads.
      // A local .bin file must not hide whether the online firmware exists.
      useEffect(() => {
        let cancelled = false;
        const configuredUrl = selectedBoard && selectedHardware && isFirmwareCompatible(selectedBoard, selectedHardware) && selectedBoard.url ? selectedBoard.url.trim() : '';
        if (!configuredUrl) {
          setGithubFirmwareStatus('unconfigured');
          setGithubFirmwareCheckedUrl('');
          return () => { cancelled = true; };
        }
        const url = /^https?:\/\//i.test(configuredUrl)
          ? configuredUrl
          : new URL(configuredUrl, GITHUB_BASE).href;
        setGithubFirmwareStatus('checking');
        setGithubFirmwareCheckedUrl(url);
        fetch(url, { method: 'HEAD', cache: 'no-store' })
          .then(response => {
            if (cancelled) return;
            setGithubFirmwareStatus(response.ok ? 'available' : 'missing');
          })
          .catch(() => {
            if (!cancelled) setGithubFirmwareStatus('error');
          });
        return () => { cancelled = true; };
      }, [selectedBoardId, selectedHardwareKey, boards]);

      useEffect(() => {
        if (terminalRef.current) {
          terminalRef.current.scrollTop = terminalRef.current.scrollHeight;
        }
      }, [sysLogs, devLogs, logTab]);

      const addSysLog = (msg, type = 'info') => {
        setSysLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), msg, type }]);
      };
      const addDevLog = (msg) => {
        setDevLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), msg, type: 'device' }]);
      };

      const startReadLoop = async (transport) => {
        isReadingRef.current = true;
        const currentPort = transport.device;
        try {
          while (currentPort.readable) {
            const reader = currentPort.readable.getReader();
            readerRef.current = reader;
            try {
              while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const text = new TextDecoder().decode(value);
                const lines = text.split('\n');
                lines.forEach(line => { if (line.trim()) addDevLog(line.trim()); });
              }
            } catch (error) { break; } 
            finally {

          }
          const selectedPort = await navigator.serial.requestPort();
          portRef.current = selectedPort;
          setIsConnected(true);
          addSysLog(t("portAuthorized"), "success");
        } catch (err) {
          addSysLog(`${t("connectError")}: ${err.message}`, "error");
        }
      };

      const stopMonitor = async () => {
        if (readerRef.current) await readerRef.current.cancel().catch(()=>{});
        while (isReadingRef.current) await new Promise(r => setTimeout(r, 50));
        if (transportRef.current) {
          await transportRef.current.disconnect().catch(()=>{});
          transportRef.current = null;
        }
        setIsMonitorRunning(false);
      };

      // =========================================================
      // START MONITOR
      // =========================================================
      const toggleSerialMonitor = async () => {
        if (isMonitorRunning) {

        } else {
          try {
            if (!portRef.current) return;
            const transport = new window.esptooljs.Transport(portRef.current);
            transportRef.current = transport;
            await transport.connect(115200); 
            setIsMonitorRunning(true);

          let firmwareString;
          if (localFile) {
             const reader = new FileReader();
             firmwareString = await new Promise((res, rej) => {
                 reader.onload = () => res(reader.result);
                 reader.onerror = rej;
                 reader.readAsBinaryString(localFile);
             });
          } else {
             addSysLog(t("downloadingFw"), "warning");
             const fetchUrl = (selectedBoard.url.startsWith('http')) ? selectedBoard.url : GITHUB_BASE + selectedBoard.url + '?t=' + new Date().getTime();
             const resp = await fetch(fetchUrl);
             if (!resp.ok) throw new Error(t("notFoundOnServer"));

                 reader.readAsBinaryString(blob);
             });

          addSysLog(t("syncing"), "warning");
          const transport = new window.esptooljs.Transport(portRef.current);

            romBaudrate: 115200,

          if (clonedRoot) clonedRoot.innerHTML = '';
          let html = '<!DOCTYPE html>\n' + sourceClone.outerHTML;
          const replaceDeclaration = (name, value) => {
            const pattern = new RegExp('const\\s+' + name + '\\s*=\\s*[\\[{][\\s\\S]*?;');
            if (!pattern.test(html)) throw new Error('Could not locate ' + name + ' in index.html');
            html = html.replace(pattern, 'const ' + name + ' = ' + JSON.stringify(value, null, 2) + ';');
          };

                {firmwareFamilies.filter(f => f !== 'All Firmware').map(family => <div key={family} className="rounded-xl border border-slate-700 bg-slate-950 p-3 space-y-2"><div className="flex items-center gap-2"><div className="min-w-0 flex-1"><p className="text-sm font-bold text-white">{family}</p><p className="text-[10px] text-slate-500">{boards.filter(b => (b.family || 'Bruce Predatory') === family).length} board/firmware entries</p></div><button onClick={() => { const value = window.prompt('Rename firmware category:', family); if (value !== null) renameFirmwareFamily(family, value); }} title="Rename category" className="rounded-lg bg-slate-800 px-3 py-2 text-pink-300"><i className="fa-solid fa-pen"></i></button><button onClick={() => deleteFirmwareFamily(family)} title="Delete category" className="rounded-lg bg-rose-950 px-3 py-2 text-rose-300"><i className="fa-solid fa-trash"></i></button></div><label className="block text-[10px] uppercase tracking-wider text-slate-400">Category card description<textarea rows="2" value={categoryDescriptions[family] || ''} onChange={e => setCategoryDescriptions(prev => ({ ...prev, [family]: e.target.value }))} placeholder="Short description shown under this category on the main page" className="mt-1 w-full resize-y bg-slate-900 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 normal-case tracking-normal" /></label></div>)}
